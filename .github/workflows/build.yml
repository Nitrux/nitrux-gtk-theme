name: Build and package GTK themes

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:testing
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install necessary packages
        run: apt -q update && apt -yy install devscripts equivs lintian sudo

      - name: Generate Debian package
        run: sudo ./gh-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nx-gtk-themes-debian
          path: '*.deb'
